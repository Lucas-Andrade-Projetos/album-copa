{% extends "base.html" %}
{% block title %}{{ codigo }} — Álbum Copa{% endblock %}

{% block content %}
<div class="erro-page">
    <div class="erro-codigo">{{ codigo }}</div>
    <h1 class="erro-titulo">{{ titulo }}</h1>
    <p class="erro-desc">{{ descricao }}</p>
    <a href="{{ url_for('auth.index') }}" class="btn-primary" style="width:auto; padding:0.7rem 2rem; display:inline-block;">
        Voltar ao início
    </a>
</div>
{% endblock %}
