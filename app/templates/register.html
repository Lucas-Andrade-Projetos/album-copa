{% extends "base.html" %}

{% block title %}Cadastro — Álbum Copa{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Criar Conta</h1>
    <form method="POST">
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required autofocus minlength="3">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm">Confirmar Senha</label>
            <input type="password" id="confirm" name="confirm" required minlength="6">
        </div>
        <button type="submit" class="btn-primary">Criar Conta</button>
    </form>
    <p class="form-footer">
        Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a>
    </p>
</div>
{% endblock %}
